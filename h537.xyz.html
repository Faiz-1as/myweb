<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>梁贤云，佐助zzz-个人网站</title>
<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}

body {
	font-family: 'Arial', sans-serif;
	height: auto;         
	overflow: auto;        

}

.container {
display: flex;
min-height: 100vh;
}

/* 左侧人物 - 科技风深蓝 */
.person-left {
flex: 1;
background: linear-gradient(135deg, #0f1a3d 0%, #1c3f9e 100%);
color: white;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 40px;
position: relative;
overflow: hidden;
transition: all 0.5s ease;
}

/* 右侧人物 - 活力橙紫 */
.person-right {
flex: 1;
background: linear-gradient(135deg, #ff7b45 0%, #d9287a 100%);
color: white;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 40px;
position: relative;
overflow: hidden;
transition: all 0.5s ease;
}

.person-left:hover, .person-right:hover {
transform: scale(1.02);
box-shadow: inset 0 0 50px rgba(255,255,255,0.2);
}

.avatar {
width: 200px;
height: 200px;
border-radius: 50%;
border: 5px solid rgba(255,255,255,0.3);
margin-bottom: 30px;
object-fit: cover;
transition: all 0.3s ease;
box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

.avatar:hover {
transform: scale(1.1);
border-color: rgba(255,255,255,0.6);
box-shadow: 0 15px 40px rgba(0,0,0,0.4);
}

h1 {
font-size: 2.5em;
margin-bottom: 10px;
text-align: center;
text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
letter-spacing: 1px;
}

.title {
font-size: 1.3em;
margin-bottom: 20px;
opacity: 0.85;
text-align: center;
font-weight: 300;
}

.bio {
text-align: center;
max-width: 400px;
line-height: 1.7;
margin-bottom: 30px;
font-size: 1.1em;
opacity: 0.9;
}

.social-links {
display: flex;
gap: 20px;
margin-top: 20px;
}

.social-links a {
color: white;
font-size: 1.8em;
transition: all 0.3s ease;
text-decoration: none;
display: inline-block;
}

.social-links a:hover {
transform: translateY(-5px);
text-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

.skills {
display: flex;
flex-wrap: wrap;
gap: 10px;
margin-top: 20px;
justify-content: center;
}

.skill-tag {
background: rgba(255,255,255,0.15);
padding: 8px 18px;
border-radius: 25px;
font-size: 0.9em;
backdrop-filter: blur(10px);
border: 1px solid rgba(255,255,255,0.2);
transition: all 0.3s ease;
}

.skill-tag:hover {
background: rgba(255,255,255,0.25);
transform: translateY(-2px);
}

/* 分割线 */
.divider {
position: absolute;
left: 50%;
top: 50%;
transform: translate(-50%, -50%);
width: 4px;
height: 80%;
background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.5), transparent);
z-index: 10;
border-radius: 2px;
}

/* 响应式设计 */
@media (max-width: 768px) {
.container {
flex-direction: column;
}
.divider {
display: none;
}
.person-left, .person-right {
padding: 20px;
display: flex;
flex-direction: column; 
}
h1 {
font-size: 2em;
}
.avatar {
width: 150px;
height: 150px;
}
}

/* 动画效果 */
@keyframes fadeIn {
from {
opacity: 0;
transform: translateY(30px);
}
to {
opacity: 1;
transform: translateY(0);
}
}

.person-left > *, .person-right > * {
animation: fadeIn 0.8s ease-out forwards;
}

.person-left h1 { animation-delay: 0.1s; }
.person-left .title { animation-delay: 0.2s; }
.person-left .avatar { animation-delay: 0s; }
.person-left .bio { animation-delay: 0.3s; }
.person-left .skills { animation-delay: 0.4s; }
.person-left .social-links { animation-delay: 0.5s; }

.person-right h1 { animation-delay: 0.1s; }
.person-right .title { animation-delay: 0.2s; }
.person-right .avatar { animation-delay: 0s; }
.person-right .bio { animation-delay: 0.3s; }
.person-right .skills { animation-delay: 0.4s; }
.person-right .social-links { animation-delay: 0.5s; }

/* 添加科技元素 */
.tech-element {
position: absolute;
width: 100%;
height: 100%;
top: 0;
left: 0;
pointer-events: none;
opacity: 0.1;
background-image:
radial-gradient(circle at 10% 20%, rgba(255,255,255,0.2) 0%, transparent 20%),
radial-gradient(circle at 90% 80%, rgba(255,255,255,0.2) 0%, transparent 20%);
}

.person-right .tech-element {
background-image:
radial-gradient(circle at 20% 30%, rgba(255,255,255,0.2) 0%, transparent 25%),
radial-gradient(circle at 80% 70%, rgba(255,255,255,0.2) 0%, transparent 25%);
}
input:focus{
	outline: 1px solid #cfcfcf;
}
.PandS{
	display: flex;
	gap: 10px;
	/* margin: 5px; */
	margin-top: 5px;
	margin-bottom: 5px;
}
.PandS_left{
	flex:1;
	border-radius: 3%;
	border: 0;
}
.PandS_right{
	color: white;
	background-color: skyblue;
	border-radius: 5%;
	border: 0;
/* 	padding:10px; */
	padding-top: 5px;
	padding-bottom: 5px;
	width: 60px;
}
.comment{
	margin-top: 20px;
	padding: 15px;
	background-color: rgba(188, 188, 188, 0.2);
	border-radius: 3px;
	width: 100%;
	letter-spacing: 4px;
	box-shadow:
	    /* inset 0 0  8px 1px rgba(255, 255, 255, 0.5),
	    inset 0 0 20px 4px rgba(255, 255, 255, 0.3), */
	    inset 0 0 1px 1px rgba(255, 255, 255, 0.3);
}
.comments{
	border: #cfcfcf 1px solid;
	padding: 5px;
	margin-top: 10px;
	border-radius: 2px;
}

.info {
  flex: 0 0 50vh;           /* 不放大、不缩小、占 50vh */
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.comment-area {
  flex: 1;                  /* 占剩余全部 */
  overflow-y: auto;         /* 留言多就出现滚动条 */
  display: flex;
  align-items: flex-start;  /* 让留言板贴顶 */
  padding: 20px;
  width:80%;
}
.comment { font-size: 0; }   /* 让空白字符不占高 */
.comment > * { font-size: initial; } /* 子元素恢复字号 */
</style>
</head>

<script>
	const SEND_API = 'https://h537.xyz/api/web/sendMessage'; // ← 换成你的真实地址
    // 拉取留言
    function load1(){
		const GET_API = 'https://h537.xyz/api/web/getMessage?belong=1'; 
		fetch(GET_API)
			.then(r=>r.json())
			.then(arr=>{
			  list1.innerHTML = arr.length
				? arr.map(m=>`<div>${m.text}<small>———${m.time}</small></div>`).join('<br>')
				: '暂无留言';
			})
			.catch(err=>list.innerText='加载失败：'+err);
    }
	function load2(){
		const GET_API = 'https://h537.xyz/api/web/getMessage?belong=2';
		fetch(GET_API)
			.then(r=>r.json())
			.then(arr=>{
			  list2.innerHTML = arr.length
				? arr.map(m=>`<div>${m.text}<small>———${m.time}</small></div>`).join('<br>')
				: '暂无留言';
			})
			.catch(err=>list.innerText='加载失败：'+err);
	}
    // 发送留言
    function send1(){
      const text = txt1.value.trim();
      if(!text) return;
      fetch(SEND_API,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({text,belong:1})
      })
      .then(r=>r.text())
      .then(()=>{txt1.value=''; load1();})
      .catch(err=>alert('发送失败：'+err));
    }
	function send2(){
	  const text = txt2.value.trim();
	  if(!text) return;
	  fetch(SEND_API,{
	    method:'POST',
	    headers:{'Content-Type':'application/json'},
	    body: JSON.stringify({text,belong:2})
	  })
	  .then(r=>r.text())
	  .then(()=>{txt2.value=''; load2();})
	  .catch(err=>alert('发送失败：'+err));
	}
    // 初始化
    load1();
	load2();
	document.getElementById('txt1').addEventListener('keydown', function (e) {
	    if (e.key === 'Enter') {    // 也可以用 e.keyCode === 13
	        e.preventDefault();       // 阻止默认换行
	        send1();                  // 执行发送
	    }
	});
	document.getElementById('txt2').addEventListener('keydown', function (e) {
	    if (e.key === 'Enter') {    // 也可以用 e.keyCode === 13
	        e.preventDefault();       // 阻止默认换行
	        send2();                  // 执行发送
	    }
	});
	const title = document.getElementById('title');
	const title2 = document.getElementById('title2');
	const comments = document.querySelectorAll('.comments');
	let hue = 0;                       // 色相 0~360
	let dir = 1;          // 1 表示增加，-1 表示减少
	let alpha = 0;        // 0 → 1 → 0
	setInterval(() => {
	    hue = (hue + 2) % 360;           // 每 50ms 加 2°，可自行调速度
	    title.style.color = `hsl(${hue} 80% 80%)`;
		title2.style.color = `hsl(${hue} 80% 80%)`;
	}, 50);
	comments.forEach(comment => {
		setInterval(() => {
			comment.style.color = `hsl(${hue} 80% 80%)`;
			alpha += 0.01 * dir;        // 步长 0.01，可自己调
			if (alpha >= 1) { alpha = 1; dir = -1; }
			if (alpha <= 0) { alpha = 0; dir =  1; }
			comment.style.border = `2px solid rgba(207, 207, 207,${alpha})`
		}, 50);
	});
	
	// 添加鼠标悬停效果
	document.querySelectorAll('.person-left, .person-right').forEach(person => {
		person.addEventListener('mouseenter', function() {
		this.style.transform = 'scale(1.02)';
		this.style.zIndex = '5';
		});
		person.addEventListener('mouseleave', function() {
		this.style.transform = 'scale(1)';
		this.style.zIndex = '1';
		});
	});
	
	// 添加技能标签点击效果
	document.querySelectorAll('.skill-tag').forEach(tag => {
		tag.addEventListener('click', function() {
		this.style.transform = 'scale(1.1)';
		setTimeout(() => {
		this.style.transform = 'scale(1)';
		}, 200);
		});
	});
	
	// 添加头像点击效果
	document.querySelectorAll('.avatar').forEach(avatar => {
		avatar.addEventListener('click', function() {
		this.style.transform = 'rotate(360deg) scale(1.1)';
		setTimeout(() => {
		this.style.transform = 'rotate(0deg) scale(1)';
		}, 600);
		});
	});
	
	// 添加键盘导航
	document.addEventListener('keydown', function(e) {
		if (e.key === 'ArrowLeft') {
		document.querySelector('.person-left').scrollIntoView({ behavior: 'smooth' });
		} else if (e.key === 'ArrowRight') {
		document.querySelector('.person-right').scrollIntoView({ behavior: 'smooth' });
		}
	});
	document.addEventListener('keydown', e => {
	  if (e.key === 'ArrowLeft')
	    document.querySelector('.person-left').scrollIntoView({behavior:'smooth'});
	  if (e.key === 'ArrowRight')
	    document.querySelector('.person-right').scrollIntoView({behavior:'smooth'});
	});
</script>
</body>
</html>
